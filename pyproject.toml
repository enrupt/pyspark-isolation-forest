[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-isolation-forest"
version = "0.1.0"
description = "Native PySpark port of linkedin/isolation-forest (standard and extended isolation forests)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-2-Clause" }
dependencies = ["pyspark>=3.4,<4", "numpy>=1.22,<2", "pandas>=1.5,<2.3", "pyarrow>=10"]

[project.optional-dependencies]
test = ["pytest", "scipy"]

[tool.setuptools]
packages = ["pyspark_isolation_forest"]
